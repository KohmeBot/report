{{define "stats"}}
<div class="card b-coral">
  <span class="tape tl"></span>
  <span class="tab"><span class="ico">📊</span>基本数据</span>
  {{with .}}
  {{with .Stats}}
  <div class="stats-grid">
    <div class="stat"><div class="stat-inner"><span class="em e-coral">💬</span><div><div class="num">{{.TotalMessages}}</div><div class="lbl">消息总数</div></div></div></div>
    <div class="stat"><div class="stat-inner"><span class="em e-mint">🙋</span><div><div class="num">{{.ActiveUsers}}</div><div class="lbl">参与人数</div></div></div></div>
    <div class="stat"><div class="stat-inner"><span class="em e-sky">✏️</span><div><div class="num">{{.CharCount}}</div><div class="lbl">字符总数</div></div></div></div>
    <div class="stat"><div class="stat-inner"><span class="em e-pink">🧩</span><div><div class="num">{{.MemeCount}}</div><div class="lbl">表情包数</div></div></div></div>
  </div>
  {{if hasAny .HighLightTime}}
  <div class="highlight-box">
    <div class="ht-l"><div class="t">✨ Highlight Time</div><div class="v">{{.HighLightTime}}</div></div>
    <div class="ht-r">此刻<br><b>群贤毕至</b></div>
  </div>
  {{end}}
  {{end}}
  {{else}}
  {{template "empty" "今天还没有统计数据~"}}
  {{end}}
</div>
{{end}}
